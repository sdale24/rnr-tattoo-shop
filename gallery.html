<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - RnR Tattoo Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header / Navigation -->
    <header>
        <div class="logo-container">
            <a href="index.html" class="brand-link">
                <div class="logo-bg">
                    <img src="rnr.jpg" alt="RnR Tattoo Shop Logo" class="shop-logo">
                </div>
                <span class="shop-name">RnR TATTOO</span>
            </a>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="booking.html">Book Now</a>
        </nav>
    </header>

    <!-- Gallery Section -->
    <section class="page-section" style="padding: 40px 20px; background: #181818; color: #fff; min-height: 80vh;">
        <h2 style="text-align: center; margin-bottom: 30px;">Latest Works & Gallery</h2>
        <div class="gallery-grid" id="dynamic-gallery" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto;">
            <p style="color: #777; text-align: center; grid-column: 1/-1;">Loading gallery...</p>
        </div>
    </section>

    <!-- Siguraduhing may type="module" -->
    <script type="module" src="script.js"></script>
</body>
</html>
