<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - RnR Tattoo Shop</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Modern Gallery UI/UX Styling */
        body {
            background-color: #0f0f0f;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .gallery-header-section {
            text-align: center;
            padding: 50px 20px 20px;
        }

        .gallery-header-section h2 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #f5f5f5;
        }

        .gallery-header-section p {
            color: #aaa;
            font-size: 1rem;
        }

        .gallery-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 30px auto 60px;
            padding: 0 20px;
        }

        .gallery-card {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
            border: 1px solid #2a2a2a;
        }

        .gallery-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(229, 142, 38, 0.2);
            border-color: #e58e26;
        }

        .gallery-thumb {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .gallery-card:hover .gallery-thumb {
            transform: scale(1.05);
        }

        /* Upgraded Lightbox UX */
        .lightbox-overlay {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox-overlay.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-content-wrapper {
            position: relative;
            max-width: 90%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }

        .lightbox-close {
            position: absolute;
            top: -50px;
            right: 0;
            font-size: 35px;
            color: #fff;
            cursor: pointer;
            background: none;
            border: none;
            transition: color 0.2s;
        }

        .lightbox-close:hover {
            color: #e58e26;
        }

        .lightbox-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(30, 30, 30, 0.8);
            color: #fff;
            border: 1px solid #444;
            font-size: 24px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s;
            z-index: 10000;
        }

        .lightbox-arrow:hover {
            background: #e58e26;
            border-color: #e58e26;
            color: #000;
        }

        .lightbox-prev { left: -70px; }
        .lightbox-next { right: -70px; }

        @media screen and (max-width: 768px) {
            .lightbox-prev { left: 10px; }
            .lightbox-next { right: 10px; }
            .lightbox-arrow { width: 40px; height: 40px; font-size: 18px; }
        }
    </style>
</head>
<body>
    <!-- Header / Navigation -->
    <header>
        <div class="logo-container">
            <a href="index.html" class="brand-link">
                <div class="logo-bg">
                    <img src="rnr.jpg" alt="RnR Tattoo Shop Logo" class="shop-logo">
                </div>
                <span class="shop-name">RnR TATTOO</span>
            </a>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="booking.html">Book Now</a>
        </nav>
    </header>

    <!-- Gallery Section -->
    <section>
        <div class="gallery-header-section">
            <h2>LATEST WORKS</h2>
            <p>Explore high-resolution masterpieces crafted by our artists in Angeles City.</p>
        </div>
        <div id="dynamic-gallery" class="gallery-grid-container">
            <p style="color: #777; text-align: center; grid-column: 1/-1; padding: 40px;">Loading gallery masterpieces...</p>
        </div>
    </section>

    <!-- High-End Lightbox Modal Structure -->
    <div id="lightbox-modal" class="lightbox-overlay">
        <div class="lightbox-content-wrapper">
            <button class="lightbox-close" id="lb-close">&times;</button>
            <button class="lightbox-arrow lightbox-prev" id="lb-prev">&#10094;</button>
            <img id="lightbox-image" class="lightbox-img" src="" alt="Full Screen Work">
            <button class="lightbox-arrow lightbox-next" id="lb-next">&#10095;</button>
        </div>
    </div>

    <!-- Script para sa Firebase at Lightbox Experience -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAEG4geh7KlAFqE5N1KtcAccCKlhcG-n-g",
            authDomain: "rnr-tattoo-shop.firebaseapp.com",
            projectId: "rnr-tattoo-shop",
            storageBucket: "rnr-tattoo-shop.firebasestorage.app",
            messagingSenderId: "799117419992",
            appId: "1:799117419992:web:9fd467af02d5e7fceb3ead",
            measurementId: "G-CXM69TRZ1T"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        document.addEventListener('DOMContentLoaded', async function() {
            const galleryGrid = document.getElementById('dynamic-gallery');
            if(!galleryGrid) return;

            try {
                const snapshot = await get(ref(database, 'rnr_gallery'));
                if(snapshot.exists()) {
                    const data = snapshot.val();
                    const galleryItems = Object.keys(data).map(key => data[key]);
                    
                    galleryGrid.innerHTML = '';
                    galleryItems.forEach((item, index) => {
                        const card = document.createElement('div');
                        card.classList.add('gallery-card');
                        card.innerHTML = `
                            <img src="${item.image_url}" alt="RnR Tattoo Art" class="gallery-thumb" data-index="${index}" loading="lazy">
                        `;
                        galleryGrid.appendChild(card);
                    });

                    setupAdvancedLightbox(galleryItems);
                } else {
                    galleryGrid.innerHTML = `<p style="text-align:center; color:#777; grid-column:1/-1; padding: 40px;">No tattoo works uploaded yet.</p>`;
                }
            } catch (error) {
                console.error('Error fetching gallery:', error);
                galleryGrid.innerHTML = `<p style="text-align:center; color:#ff6b6b; grid-column:1/-1;">Failed to load gallery items.</p>`;
            }
        });

        function setupAdvancedLightbox(galleryItems) {
            const modal = document.getElementById('lightbox-modal');
            const modalImg = document.getElementById('lightbox-image');
            const closeBtn = document.getElementById('lb-close');
            const prevBtn = document.getElementById('lb-prev');
            const nextBtn = document.getElementById('lb-next');

            let currentIndex = 0;

            function showImage(index) {
                if(index < 0) currentIndex = galleryItems.length - 1;
                else if(index >= galleryItems.length) currentIndex = 0;
                else currentIndex = index;
                
                modalImg.src = galleryItems[currentIndex].image_url;
            }

            // Click event sa bawat card para mag-full screen
            document.querySelectorAll('.gallery-card').forEach(card => {
                card.addEventListener('click', function() {
                    const img = this.querySelector('.gallery-thumb');
                    currentIndex = parseInt(img.getAttribute('data-index'));
                    showImage(currentIndex);
                    modal.classList.add('active');
                    document.body.style.overflow = 'hidden'; // Stop background scrolling
                });
            });

            const closeModal = () => {
                modal.classList.remove('active');
                document.body.style.overflow = 'auto';
            };

            closeBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });

            prevBtn.addEventListener('click', (e) => { e.stopPropagation(); showImage(currentIndex - 1); });
            nextBtn.addEventListener('click', (e) => { e.stopPropagation(); showImage(currentIndex + 1); });

            // Keyboard navigation (Arrow keys at Escape)
            document.addEventListener('keydown', (e) => {
                if(!modal.classList.contains('active')) return;
                if(e.key === 'ArrowRight') showImage(currentIndex + 1);
                if(e.key === 'ArrowLeft') showImage(currentIndex - 1);
                if(e.key === 'Escape') closeModal();
            });
        }
    </script>
</body>
</html>
