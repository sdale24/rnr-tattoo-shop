<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - RnR Tattoo Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header / Navigation -->
    <header>
        <div class="logo-container">
            <a href="index.html" class="brand-link">
                <div class="logo-bg">
                    <img src="rnr.jpg" alt="RnR Tattoo Shop Logo" class="shop-logo">
                </div>
                <span class="shop-name">RnR TATTOO</span>
            </a>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="booking.html">Book Now</a>
        </nav>
    </header>

    <!-- Gallery Section -->
    <section class="page-section">
        <h2>Latest Works & Gallery</h2>
        <div class="gallery-grid" id="dynamic-gallery">
            <div class="gallery-item">
                <img src="placeholder1.jpg" alt="Tattoo Work">
                <p class="tattoo-caption">Sample Work by RnR</p>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
